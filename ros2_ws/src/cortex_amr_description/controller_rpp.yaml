# Regulated pure pursuit for the Cortex AMR: the FollowPath block ONLY.
#
# an earlier module swaps controllers by replacing this one block, because that is the
# whole point of nav2_core::Controller being a pluginlib interface: controller_server
# does not know or care which one it loaded.
#
# Every value here is either OUR robot's real limit (from nav2_params.yaml,
# measured in 8.10) or the plugin's own declared default
# (reference/rpp_declared_defaults.yaml, dumped from a live controller_server).
# Where they differ from stock, the reason is stated.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- our robot's limits, NOT the plugin defaults ----------------------
      # Stock desired_linear_vel is 0.5 and that happens to match ours, but it is
      # set explicitly so the file states the limit rather than inheriting it.
      desired_linear_vel: 0.5
      # 1.8 stock vs our measured wz_max 1.9: keep 1.8, because the pivot should
      # not be the manoeuvre that saturates the drive.
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2

      # --- lookahead -------------------------------------------------------
      # 9.7 measured the trade on OUR path: 0.6 m keeps max cross-track at
      # 0.246 m. Velocity-scaled lookahead is left FALSE so the one parameter
      # stays one parameter, which is the property that module argued for.
      lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5

      # --- the three regulations -------------------------------------------
      # 9.10 measured that on our warehouse path the curvature term fires on
      # 0 of 522 steps (tightest radius demanded is 1.19 m against this 0.9 m
      # trigger). It stays ENABLED anyway: the aisles are not the only place
      # this robot drives, and a regulation that costs nothing when it does not
      # apply is not worth removing.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # The proximity term is the one that actually works here: 24.9% of steps.
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      # MUST match the inflation layer's own scaling factor or the inversion
      # d = (f*r_inscribed - ln(cost) + ln(253)) / f returns a distance that is
      # not the distance. Our inflation_layer uses 3.0.
      inflation_cost_scaling_factor: 3.0
      # Approach: 0.6 m of ramp, floored so it arrives rather than creeping.
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

      # --- rotate to heading ------------------------------------------------
      # This, not the velocity caps, is what fixes the large-heading-error case
      # 9.7 could not recover from: measured 0.362 m -> 0.248 m max cross-track.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785

      # --- collision checking ------------------------------------------------
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      # Our AMR is differential drive with a 0.80 x 0.58 m footprint: reversing
      # is available but should not be a routine path-following choice.
      allow_reversing: false
      transform_tolerance: 0.1
