# DWB for the Cortex AMR: the FollowPath block ONLY.
#
# an earlier module loads this by swapping one block. Values are OUR robot's real
# limits plus the plugin's declared defaults where they are already right
# (reference/dwb_declared_defaults.yaml, dumped from a live controller_server in
# an earlier module). Critic weights are the ones 9.8 measured, not tutorial numbers.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # --- our robot's kinematic box ----------------------------------------
      # From nav2_params.yaml, measured in 8.10. min_vel_x is 0.0 and
      # min_speed_theta -1.9: this robot can spin in place, which is what makes
      # the rotate-in-place recoveries available at all.
      min_vel_x: 0.0
      max_vel_x: 0.5
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.9
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2

      # --- the sampling grid -------------------------------------------------
      # 9.8 measured what this actually costs: 20 x 20 = 400 candidate commands
      # per tick, each rolled out over sim_time. vy_samples stays at the stock 5
      # and does nothing on a diff-drive robot, which is worth knowing rather
      # than tidying away.
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.5
      angular_granularity: 0.025
      transform_tolerance: 0.1
      discretize_by_time: false

      # --- critics -----------------------------------------------------------
      # 9.8's measurement: with every scale at the stock 1.0, PathAlign and
      # GoalAlign use forward_point_distance 0.325, and BaseObstacle is a
      # CENTRE-point check. That last one is the same blind spot MPPI has with
      # consider_footprint false, and it is why 22 of the sampled commands were
      # vetoed only after the footprint was considered.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
