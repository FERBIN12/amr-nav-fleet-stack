# slam_toolbox online async, configured for the Cortex AMR.
#
# Derived from /opt/ros/jazzy/share/slam_toolbox/config/mapper_params_online_async.yaml
# with only the values this robot actually needs changed. Everything left alone is
# left alone on purpose: the defaults in that file are well chosen and an earlier module
# is about the handful that are NOT portable between robots.

slam_toolbox:
  ros__parameters:
    # ---- the four that must match THIS robot -----------------------------------
    # base_footprint, not base_link. The DiffDrive plugin publishes /odom with
    # child_frame_id base_footprint (cortex_amr.gazebo.xacro), and the same
    # mismatch silently starved the EKF in 6.6 until it was corrected there.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    # /scan_front, NOT /scan. This robot carries TWO 270 degree safety scanners on
    # opposite chamfers, published as /scan_front and /scan_rear, so there is no
    # topic called /scan at all and the stock config subscribes to nothing. SLAM
    # runs on the front scanner; merging the pair is a an earlier module exercise, not a
    # default, because a merged cloud from two poses needs both transforms applied
    # first and slam_toolbox expects a single LaserScan from a single frame.
    scan_topic: /scan_front

    mode: mapping

    # ---- sim time -------------------------------------------------------------
    # Gazebo stamps everything with SIMULATION time. A node on wall time sees each
    # message as ~1.8 billion seconds stale and discards all of them, which is
    # exactly how the EKF in 6.6 published a healthy 31 Hz of pure dead reckoning
    # while accepting zero measurements. /clock must also be bridged.
    use_sim_time: true

    # ---- grid ------------------------------------------------------------------
    # 5 cm is the stock default and the right call here: fine enough to resolve a
    # pallet leg, coarse enough that the whole 20 x 40 m warehouse is 400 x 800 =
    # 320,000 cells. Nav2 reads this grid directly, so this number sets the finest
    # gap the planner can ever find.
    resolution: 0.05
    # our scanners are 12 m parts (see the <range><max> in cortex_amr.gazebo.xacro),
    # so claiming the stock 20 m would have slam_toolbox trust returns the sensor
    # cannot produce.
    max_laser_range: 12.0

    # ---- when to add a node to the pose graph ---------------------------------
    # Stock is 0.5 m / 0.5 rad. At the 0.25 m/s this project drives at, that is a
    # new node every two seconds, which is a reasonable graph density for a
    # warehouse. Lower it and the graph grows without adding information.
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    throttle_scans: 1

    transform_publish_period: 0.02
    map_update_interval: 5.0

    # ---- loop closure ---------------------------------------------------------
    # This is the capability that lets SLAM improve the PAST, per an earlier module, and
    # it is on by default. 3 m of search is generous for aisles this wide.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- scan matcher ---------------------------------------------------------
    # slam_toolbox correlates rather than descends (an earlier module), so these bound
    # the search WINDOW rather than a step size.
    use_scan_matching: true
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
